[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "radt"
authors = [{name = "Ties Robroek", email = "titr@itu.dk"}]
readme = "README.md"
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
dependencies = [
    "mlflow >=2.4.0",
    "pandas >=2.0.0",
    "migedit >= 0.2.0",
    "boto3 >= 1.25.0",
    "pyyaml >= 6.0.0"
]

[project.optional-dependencies]
test = ["pytest >= 7.0", "pytest-timeout >= 2.0"]

[project.urls]
Home = "https://github.com/Resource-Aware-Data-systems-RAD/radt"

[project.scripts]
radt = "radt:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The exporter runs in a child process, so a wedged drain would otherwise hang
# the suite rather than fail it.
timeout = 300
markers = [
    "slow: spawns an exporter process and talks to a real mlflow store",
]
