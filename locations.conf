	client_max_body_size 100m;

	location /mlflow/ {
		auth_basic "radt";
		auth_basic_user_file /etc/nginx/.htpasswd;
		proxy_pass  http://mlflow:5000/;
	}

	location /radt/ {
		auth_basic "radt";
		auth_basic_user_file /etc/nginx/.htpasswd;
		proxy_pass  http://visual:80/;
	}

	# The dashboard reaches its API through here rather than /api/. Sitting
	# under the path the browser already authenticated for means credentials
	# are sent with the request itself, instead of relying on the browser to
	# retry a 401 with what it cached for the realm.
	location /radt/api/ {
		auth_basic "radt";
		auth_basic_user_file /etc/nginx/.htpasswd;
		proxy_pass  http://frontend-api:4000/;
	}

	location /api/ {
		# Same realm as /mlflow/ and /radt/: the dashboard fetches this from a
		# page the browser has already authenticated for, and a matching realm
		# is what lets it reuse those credentials instead of prompting again.
		auth_basic "radt";
		auth_basic_user_file /etc/nginx/.htpasswd;
		proxy_pass  http://frontend-api:4000/;
	}

	location /minio/ {
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $http_host;

		proxy_connect_timeout 300;
		# Default is HTTP/1, keepalive is only enabled in HTTP/1.1
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		chunked_transfer_encoding off;

		proxy_pass http://minio:9001/;
	}
